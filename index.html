function camAt(f){f=Math.max(0,Math.min(F,f));const i=Math.floor(f),j=Math.min(F,i+1),t=f-i,L=(a,b)=>a+(b-a)*t,p=f/F;
 return{s:L(cam.S[i],cam.S[j]),opt:{center:[L(cam.X[i],cam.X[j]),L(cam.Y[i],cam.Y[j])],bearing:L(cam.B[i],cam.B[j]),pitch:58,zoom:15.2-(p>0.85?(p-0.85)/0.15*0.8:0)}};}
function show(f){const c=camAt(f);map.jumpTo(c.opt);draw(c.s);}
function fly(ms,done){buildCam();const t0=performance.now();playing=true;const step=now=>{if(!playing)return;const f=(now-t0)/ms*F;show(f);if(f<F)raf=requestAnimationFrame(step);else{playing=false;done&&done();}};raf=requestAnimationFrame(step);}
function stop(){playing=false;cancelAnimationFrame(raf);}
const idle=()=>new Promise(r=>{let d=0;const f=()=>{if(!d){d=1;r()}};map.once('idle',f);setTimeout(f,5000);});
$('play').onclick=()=>{if(playing){stop();$('play').textContent='▶ 3D 영상 보기';return;}$('play').textContent='■ 멈춤';map.jumpTo({center:track[0],zoom:15,pitch:60});draw(0);map.once('idle',()=>fly(SECS*1000,()=>$('play').textContent='▶ 3D 영상 보기'));};
$('sample').textContent='기본 경로로 돌아가기';$('sample').onclick=()=>{stop();setOreum(cur);msg('')};
// ---- 사진 ----
async function addPhoto(file,q){try{const bm=await createImageBitmap(file,{resizeWidth:480,resizeQuality:'medium'});const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);

function spreadPhotos(){const n=photos.filter(p=>p.fixed!==true&&p.q==null).length;let k=0;photos.forEach(p=>{if(p.q==null){p.q=0.15+0.7*(++k)/(n+1)}});photos.sort((a,b)=>a.q-b.q);}
$('pick').onchange=async e=>{for(const f of e.target.files)await addPhoto(f,null);spreadPhotos();e.target.value='';msg('사진 '+photos.length+'장 들어갔어요. 영상에 나와요 📷');};
// ---- GPX ----
$('gpx').onchange=async e=>{const f=e.target.files[0];if(!f)return;const doc=new DOMParser().parseFromString(await f.text(),'text/xml');
 const pts=[...doc.querySelectorAll('trkpt')].map(p=>[+p.getAttribute('lon'),+p.getAttribute('lat')]).filter(a=>isFinite(a[0])&&isFinite(a[1]));
 const r=pts.length>1&&resample(pts);if(!r){msg('GPX에서 경로를 못 찾았어요');return;}
 let best=0,bd=1e9;OREUMS.forEach((o,i)=>{const d=Math.min(...r.filter((_,k)=>k%10==0).map(p=>hav(p,[o.lon,o.lat])));if(d<bd){bd=d;best=i}});
 stop();cur=best;setSel(best);$('hn').textContent=OREUMS[best].n;photos=[];setTrack(r,false);map.jumpTo({center:r[0],zoom:15,pitch:60});msg('GPX 불러옴: '+OREUMS[best].n);e.target.value='';};
// ---- 실시간 GPS 기록 ----
let watchId=null,pts=[],alts=[],t0=0,tick=0,wl=null,summit=false,lastRaw=null,snapPts=[];
const KEY='oreumRec1';
async function wake(){try{if('wakeLock'in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mode==='rec')wake()});
function banner(t){const b=$('banner');b.textContent=t;b.style.display='block';setTimeout(()=>b.style.display='none',6000);}
function setMode(m){mode=m;$('idle').classList.toggle('hide',m!=='idle');$('live').classList.toggle('hide',m!=='rec');$('idle').style.display=m==='idle'?'grid':'none';$('live').style.display=m==='rec'?'grid':'none';}
function onPos(pos){const c=pos.coords,p=[c.longitude,c.latitude];lastRaw=p;
 map.getSource('me').setData({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:p}}]});
 if(c.accuracy>40){msg('GPS 신호 약함 (±'+Math.round(c.accuracy)+'m) · 하늘이 보이는 곳으로');return;}
 const last=pts[pts.length-1];if(last){const d=hav(last,p),dt=(pos.timestamp-last.t)/1000;if(d<4)return;if(dt>0&&d/dt>12)return;}
 const q=[p[0],p[1]];q.t=pos.timestamp;pts.push(q);elevAt(p[0],p[1]).then(v=>alts.push(c.altitude!=null&&c.altitude>0?c.altitude:v));
 try{localStorage.setItem(KEY,JSON.stringify({o:cur,pts:pts.map(a=>[a[0],a[1],a.t])}))}catch(e){}
 let d=0;for(let i=1;i<pts.length;i++)d+=hav(pts[i-1],pts[i]);
 map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:pts.length>1?pts:[p,p]}});
 $('hd').textContent=(d/1000).toFixed(2);const a=alts[alts.length-1];$('he').textContent=a==null?'-':Math.round(a);
 let up=0;for(let i=1;i<alts.length;i++)if(alts[i]-alts[i-1]>0.8)up+=alts[i]-alts[i-1];$('hu').textContent=Math.round(up);
 map.easeTo({center:p,zoom:16.3,pitch:50,duration:900});msg('기록 중 · 점 '+pts.length+'개');
 if(!summit){const o=OREUMS[cur];if(!o.tid&&hav(p,[o.lon,o.lat])<90){summit=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}banner('🎉 정상 도착! '+o.n+' · '+$('ht').textContent);}}}
function onErr(e){msg(e.code===1?'위치 권한을 허용해 주세요 (주소창 자물쇠 → 위치 허용)':'GPS를 못 잡았어요: '+e.message);}
$('start').onclick=async()=>{if(!navigator.geolocation){msg('이 기기는 GPS를 지원하지 않아요');return;}
 stop();photos=[];setTrack(makeSample(OREUMS[cur]),true);$('sub').textContent='기록 중…';pts=[];alts=[];summit=false;setMode('rec');
 map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:[[0,0],[0,0]]}});$('hd').textContent='0.00';$('hu').textContent='0';$('he').textContent='-';$('hp').textContent='';
 await wake();t0=Date.now();tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('ht').innerHTML='시간 <b>'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</b>'},1000);
 watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});msg('GPS 찾는 중… 화면을 켜 두세요');};
$('snap').onchange=async e=>{const f=e.target.files[0];if(!f)return;let d=0;for(let i=1;i<pts.length;i++)d+=hav(pts[i-1],pts[i]);snapPts.push({f,d});e.target.value='';msg('사진 저장됨 📷 ('+snapPts.length+'장)');};
$('stop').onclick=async()=>{navigator.geolocation.clearWatch(watchId);clearInterval(tick);try{wl&&wl.release()}catch(e){}
 map.getSource('me').setData({type:'FeatureCollection',features:[]});setMode('idle');
 const r=pts.length>=3&&resample(pts);
 if(!r){msg('기록이 너무 짧아요. 조금 더 걸은 뒤 끝내 주세요 (샘플 경로로 돌아갑니다)');snapPts=[];setOreum(cur);return;}
 let T=0;for(let i=1;i<pts.length;i++)T+=hav(pts[i-1],pts[i]);photos=[];setTrack(r,false);
 for(const s of snapPts)await addPhoto(s.f,Math.min(0.88,s.d/T));snapPts=[];spreadPhotos();
 map.jumpTo({center:r[0],zoom:15,pitch:60});msg('기록 완료! ▶ 영상 보기 / 🎬 영상 저장을 눌러 보세요 ('+(T/1000).toFixed(2)+'km)');};
// ---- 영상 저장 (프레임 단위, H.264 mp4) ----
let busy=false;
$('rec').onclick=async()=>{if(busy)return;
 if(typeof VideoEncoder==='undefined'){msg('이 브라우저는 영상 저장을 지원하지 않아요 (크롬 최신 버전 필요)');return;}
 stop();busy=true;$('play').disabled=true;$('rec').disabled=true;map.jumpTo({center:track[0],zoom:15,pitch:60});draw(0);const o=OREUMS[cur];await idle();await sleep(800);buildCam();
 const W=540,H=960,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),mc=map.getCanvas();
 let cf=null;for(const codec of['avc1.640028','avc1.4d0028','avc1.42001f']){const t={codec,width:W,height:H,bitrate:5e6,framerate:FPS};try{if((await VideoEncoder.isConfigSupported(t)).supported){cf=t;break}}catch(e){}}
 const done=()=>{busy=false;$('play').disabled=false;$('rec').disabled=false;$('rec').textContent='🎬 영상 저장'};
 if(!cf){msg('이 기기는 H.264 저장을 지원하지 않아요');done();return;}
 let audio=false;const acfg={codec:'mp4a.40.2',sampleRate:44100,numberOfChannels:1,bitrate:64000};
 try{audio=typeof AudioEncoder!=='undefined'&&(await AudioEncoder.isConfigSupported(acfg)).supported}catch(e){}
 const target=new Mp4Muxer.ArrayBufferTarget();
 const mux=new Mp4Muxer.Muxer({target,video:{codec:'avc',width:W,height:H,frameRate:FPS},...(audio?{audio:{codec:'aac',numberOfChannels:1,sampleRate:44100}}:{}),fastStart:'in-memory'});
 const ve=new VideoEncoder({output:(ch,m)=>mux.addVideoChunk(ch,m),error:e=>msg('인코딩 오류: '+e.message)});ve.configure(cf);
 if(audio){const ae=new AudioEncoder({output:(ch,m)=>mux.addAudioChunk(ch,m),error:()=>{}});ae.configure(acfg);const tot=44100*SECS,blk=4410;
  for(let n=0;n<tot;n+=blk)ae.encode(new AudioData({format:'f32-planar',sampleRate:44100,numberOfFrames:blk,numberOfChannels:1,timestamp:Math.round(n/44100*1e6),data:new Float32Array(blk)}));await ae.flush();}
 const t0=performance.now();
 for(let f=0;f<=F;f++){const cm=camAt(f);map.jumpTo(cm.opt);draw(cm.s);await idle();
  const sc=Math.max(W/mc.width,H/mc.height),w=mc.width*sc,h=mc.height*sc;g.drawImage(mc,(W-w)/2,(H-h)/2,w,h);
  const gr=g.createLinearGradient(0,H-220,0,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.7)');g.fillStyle=gr;g.fillRect(0,H-220,W,220);
  if(curPhoto){const im=curPhoto.img,pw=230,ph=pw*im.height/im.width,px=W-pw-24,py=H-250-ph;g.save();g.translate(px+pw/2,py+ph/2);g.rotate(0.05);g.fillStyle='#fff';g.fillRect(-pw/2-8,-ph/2-8,pw+16,ph+16);g.drawImage(im,-pw/2,-ph/2,pw,ph);g.restore();}
  g.fillStyle='#fff';g.font='800 44px sans-serif';g.fillText(o.n,32,H-130);g.font='600 28px sans-serif';
  g.fillText('거리 '+$('hd').textContent+'km   고도 '+$('he').textContent+'m   상승 '+$('hu').textContent+'m',32,H-80);
  g.fillStyle='rgba(255,255,255,.3)';g.fillRect(32,H-48,W-64,6);g.fillStyle='#ff8a3d';g.fillRect(32,H-48,(W-64)*cm.s,6);
  g.font='500 18px sans-serif';g.fillStyle='rgba(255,255,255,.7)';g.fillText('제주 오름 3D 트립',W-190,44);
  const vf=new VideoFrame(c,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(vf,{keyFrame:f%FPS===0});vf.close();
  while(ve.encodeQueueSize>8)await sleep(5);
  if(f%5===0){$('rec').textContent='만드는 중 '+Math.round(f/F*100)+'%';msg('화면을 켜 두세요');}}
 await ve.flush();mux.finalize();
 const blob=new Blob([target.buffer],{type:'video/mp4'}),url=URL.createObjectURL(blob);
 msg('완료! <a href="'+url+'" download="'+o.n+'.mp4">'+o.n+'.mp4 저장</a> ('+Math.round(blob.size/1024)+'KB, '+Math.round((performance.now()-t0)/1000)+'초)');
 const a=document.createElement('a');a.href=url;a.download=o.n+'.mp4';a.click();window.__recurl=url;window.__rec={size:blob.size,audio};done();};
map.on('load',()=>{{const t=new URLSearchParams(location.search).get('o');setOreum(t?+t:0);if(t)setSel(+t);}setMode('idle');window.__ready=true;
 try{const sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.pts&&sv.pts.length>10){const r=resample(sv.pts,300);if(r){cur=sv.o;setSel(cur);$('hn').textContent=OREUMS[cur].n;setTrack(r,false);map.jumpTo({center:r[0],zoom:15,pitch:60});msg('마지막 기록을 불러왔어요 ('+(total/1000).toFixed(2)+'km)')}}}catch(e){}
 const m=location.hash.match(/shot=([\d.]+)/);if(m){buildCam();show(+m[1]*F);}});
window.__st=()=>({mode,pts:pts.length,summit,isSample,total:Math.round(total),photos:photos.length});
